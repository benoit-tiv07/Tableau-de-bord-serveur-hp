<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12151c">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <link rel="icon" href="{{ url_for('static', filename='icon-192.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-192.png') }}">
  <title>{% block titre %}Serveur HP{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav class="menu">
    <a href="{{ url_for('accueil') }}" class="{{ 'actif' if page == 'accueil' }}">Accueil</a>
    <a href="{{ url_for('page_machines') }}" class="{{ 'actif' if page == 'machines' }}">Machines</a>
    <a href="{{ url_for('page_rss') }}" class="{{ 'actif' if page == 'rss' }}">RSS</a>
    <a href="{{ url_for('bbox.page') }}" class="{{ 'actif' if page == 'bbox' }}">Bbox</a>
  </nav>
  <main>
    {% block contenu %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
